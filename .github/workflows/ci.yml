name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  host-checks:
    name: host source checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare host virtualenv
        run: |
          python3 -m venv work/host-venv
          work/host-venv/bin/python -m pip install --upgrade pip
          work/host-venv/bin/python -m pip install -r tools/ci/requirements-host.txt
      - name: Source integrity
        run: work/host-venv/bin/python tools/ci/check-source-integrity.py
      - name: Byte-compile runtime, tools, config and tests
        run: work/host-venv/bin/python -m compileall -q runtime tools config tests
      - name: Host test suites
        run: work/host-venv/bin/python tools/ci/run-host-tests.py
      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-checks-evidence
          path: work/ci/evidence
          if-no-files-found: ignore

  native-python:
    name: native python inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install PC build prerequisites
        run: bash tools/ci/setup-linux.sh native-python
      - name: Runner identity
        run: python3 -B tools/ci/native_validation.py identity
      - name: Restore inputs
        run: python3 -B tools/ci/native_validation.py restore
      - name: Native helpers
        run: python3 -B tools/ci/native_validation.py helpers
      - name: Native python tests
        run: python3 -B tools/ci/native_validation.py python-tests
      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-python-evidence
          path: work/ci/evidence
          if-no-files-found: ignore

  engine-tests:
    name: engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and test runners
        run: bash tools/ci/setup-linux.sh linux-tests
      - name: Restore pinned engine sources
        run: python3 -B tools/ci/native_validation.py restore
      - name: Engine tests
        run: python3 -B tools/ci/native_validation.py engine-tests
      - name: Engine final checks
        run: python3 -B tools/ci/native_validation.py engine-final-checks
      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests-evidence
          path: work/ci/evidence
          if-no-files-found: ignore

  arm64-engine:
    name: arm64 engine build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: bash tools/ci/setup-linux.sh arm64-build
      - name: Restore pinned engine sources
        run: python3 -B tools/ci/native_validation.py restore
      - name: ARM64 dependencies
        run: python3 -B tools/ci/native_validation.py arm-dependencies
      - name: ARM64 engine build
        run: python3 -B tools/ci/native_validation.py arm-build
      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-engine-evidence
          path: work/ci/evidence
          if-no-files-found: ignore
